name: Publish release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: crates-io
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: ${{ github.event.release.prerelease == false }}
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with default features
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Clippy with all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test with default features
        run: cargo test --locked

      - name: Test with all features
        run: cargo test --locked --all-features

  publish:
    name: Publish to crates.io
    needs:
      - verify
    runs-on: windows-latest
    environment: crates-io

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Validate release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $metadata = cargo metadata --locked --no-deps --format-version 1 |
            ConvertFrom-Json
          $package = $metadata.packages |
            Where-Object { $_.name -eq "safe-sid" }

          if ($null -eq $package) {
            Write-Error "Could not determine the safe-sid package version."
          }

          $packageVersion = $package.version

          if ($packageVersion -match "[-+]") {
            Write-Error "Only stable package versions can be published by this workflow."
          }

          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            Write-Error "Release tag '$env:RELEASE_TAG' does not match package version '$packageVersion'."
          }

          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The release tag must point to a commit on '$env:DEFAULT_BRANCH'."
          }

      - name: Verify package
        run: cargo publish --locked --dry-run

      - name: Authenticate with crates.io
        id: crates_io
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish package
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io.outputs.token }}
