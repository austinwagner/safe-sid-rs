[package]
name = "safe-sid"
version = "0.1.1"
edition = "2024"
description = "Safe borrowed/owned wrappers over a Windows security identifier (SID)."
license = "ISC"
keywords = ["windows", "security", "SID"]
categories = ["api-bindings", "os::windows-apis"]
repository = "https://github.com/austinwagner/safe-sid-rs"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
windows-full = ["dep:windows"]

[dependencies]
windows-core = "0.62"
windows-link = "0.2"
windows = { version = "0.62", optional = true, default-features = false, features = [
    "Win32_Security",
] }

[build-dependencies]
windows-bindgen = "0.63"
