[package]
name = "safe-sid"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Safe borrowed/owned wrappers over a Windows security identifier (SID)."
license = "ISC"
keywords = ["windows", "security", "SID"]
categories = ["api-bindings", "os::windows-apis"]
repository = "https://github.com/austinwagner/safe-sid-rs"
exclude = [".cargo", "xtask"]

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
windows-link = "0.2"

[dev-dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Security",
] }
